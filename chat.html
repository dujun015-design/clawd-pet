<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Claude</title>
  <style>
    :root {
      --bg: #fafafa;
      --bg-elevated: #fff;
      --border: #ececec;
      --text: #1c1c1e;
      --text-muted: #8e8e93;
      --accent: #c46a2f;
      --accent-soft: #fdf3ec;
      --bubble-user: #1c1c1e;
      --bubble-user-text: #fff;
      --bubble-claude: #f4f4f5;
      --bubble-claude-text: #1c1c1e;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #1c1c1e;
        --bg-elevated: #242427;
        --border: #2f2f33;
        --text: #f2f2f7;
        --text-muted: #8e8e93;
        --accent: #e07b39;
        --accent-soft: #2a1f17;
        --bubble-user: #e07b39;
        --bubble-user-text: #fff;
        --bubble-claude: #2c2c2f;
        --bubble-claude-text: #f2f2f7;
      }
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      height: 100%;
      overflow: hidden;
    }

    body {
      font-family: -apple-system, 'SF Pro Text', BlinkMacSystemFont, sans-serif;
      background: var(--bg);
      color: var(--text);
      font-size: 14px;
      line-height: 1.5;
      display: flex;
      flex-direction: column;
      -webkit-font-smoothing: antialiased;
    }

    /* Titlebar — leaves 80px on the left for macOS traffic-light buttons */
    #titlebar {
      height: 38px;
      padding-left: 80px;
      padding-right: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      -webkit-app-region: drag;
      background: var(--bg);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
      position: relative;
    }
    #title-text {
      font-size: 13px;
      font-weight: 600;
      color: var(--text);
      letter-spacing: -0.01em;
    }
    .title-sub {
      font-size: 11px;
      color: var(--text-muted);
      margin-left: 6px;
      font-weight: 400;
    }

    /* Tab bar */
    #tabbar {
      display: flex;
      align-items: center;
      background: var(--bg);
      border-bottom: 1px solid var(--border);
      padding: 4px 8px;
      gap: 4px;
      flex-shrink: 0;
      overflow-x: auto;
    }
    #tabbar::-webkit-scrollbar { height: 0; }
    #tabs { display: flex; gap: 3px; flex: 1; overflow-x: auto; }
    #tabs::-webkit-scrollbar { height: 0; }
    .tab {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 5px 8px 5px 12px;
      background: transparent;
      border: 1px solid transparent;
      border-radius: 8px;
      font-size: 12px;
      color: var(--text-muted);
      cursor: pointer;
      max-width: 160px;
      min-width: 60px;
      flex-shrink: 0;
      user-select: none;
      -webkit-user-select: none;
    }
    .tab:hover { background: rgba(0,0,0,0.04); }
    @media (prefers-color-scheme: dark) {
      .tab:hover { background: rgba(255,255,255,0.06); }
    }
    .tab.active {
      background: var(--bg-elevated);
      color: var(--text);
      border-color: var(--border);
      font-weight: 600;
    }
    .tab-title {
      flex: 1;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .tab-streaming-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--accent);
      animation: pulse 1s infinite;
      flex-shrink: 0;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }
    .tab-close {
      width: 16px;
      height: 16px;
      border-radius: 4px;
      border: none;
      background: transparent;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 14px;
      line-height: 14px;
      padding: 0;
      opacity: 0.6;
    }
    .tab-close:hover {
      background: rgba(0,0,0,0.1);
      opacity: 1;
    }
    @media (prefers-color-scheme: dark) {
      .tab-close:hover { background: rgba(255,255,255,0.1); }
    }
    #new-tab-btn {
      width: 26px;
      height: 26px;
      border: none;
      background: transparent;
      color: var(--text-muted);
      border-radius: 6px;
      cursor: pointer;
      font-size: 16px;
      flex-shrink: 0;
    }
    #new-tab-btn:hover { background: rgba(0,0,0,0.06); color: var(--text); }
    @media (prefers-color-scheme: dark) {
      #new-tab-btn:hover { background: rgba(255,255,255,0.08); }
    }

    /* Messages */
    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 20px 18px 8px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      scroll-behavior: smooth;
    }
    #messages::-webkit-scrollbar { width: 6px; }
    #messages::-webkit-scrollbar-track { background: transparent; }
    #messages::-webkit-scrollbar-thumb {
      background: transparent;
      border-radius: 3px;
    }
    #messages:hover::-webkit-scrollbar-thumb {
      background: var(--border);
    }

    .msg {
      max-width: 82%;
      display: flex;
      flex-direction: column;
    }
    .msg.user { align-self: flex-end; }
    .msg.claude { align-self: flex-start; }

    .bubble-text {
      padding: 9px 13px;
      border-radius: 16px;
      word-wrap: break-word;
      word-break: break-word;
      font-size: 14px;
      line-height: 1.55;
    }
    .user .bubble-text { white-space: pre-wrap; }

    /* Markdown styles inside Claude bubbles */
    .claude .bubble-text p   { margin: 0; }
    .claude .bubble-text p + p,
    .claude .bubble-text ul,
    .claude .bubble-text ol,
    .claude .bubble-text pre,
    .claude .bubble-text blockquote { margin-top: 8px; }
    .claude .bubble-text h1,
    .claude .bubble-text h2,
    .claude .bubble-text h3 {
      font-size: 14px; font-weight: 700;
      margin: 8px 0 4px;
    }
    .claude .bubble-text ul,
    .claude .bubble-text ol { padding-left: 22px; }
    .claude .bubble-text li { margin: 2px 0; }
    .claude .bubble-text strong { font-weight: 700; }
    .claude .bubble-text em { font-style: italic; }
    .claude .bubble-text code {
      font-family: 'SF Mono', Menlo, monospace;
      font-size: 12.5px;
      background: rgba(0,0,0,0.06);
      padding: 1px 5px;
      border-radius: 4px;
    }
    @media (prefers-color-scheme: dark) {
      .claude .bubble-text code { background: rgba(255,255,255,0.1); }
    }
    .claude .bubble-text pre {
      background: rgba(0,0,0,0.06);
      padding: 8px 10px;
      border-radius: 8px;
      overflow-x: auto;
    }
    @media (prefers-color-scheme: dark) {
      .claude .bubble-text pre { background: rgba(255,255,255,0.08); }
    }
    .claude .bubble-text pre code {
      background: transparent;
      padding: 0;
      font-size: 12.5px;
    }
    .claude .bubble-text blockquote {
      border-left: 3px solid var(--border);
      padding-left: 10px;
      color: var(--text-muted);
    }
    .claude .bubble-text a {
      color: var(--accent);
      text-decoration: none;
    }
    .claude .bubble-text a:hover { text-decoration: underline; }
    .claude .bubble-text hr {
      border: none;
      border-top: 1px solid var(--border);
      margin: 10px 0;
    }
    .user .bubble-text {
      background: var(--bubble-user);
      color: var(--bubble-user-text);
      border-bottom-right-radius: 4px;
    }
    .claude .bubble-text {
      background: var(--bubble-claude);
      color: var(--bubble-claude-text);
      border-bottom-left-radius: 4px;
    }

    .cursor {
      display: inline-block;
      width: 2px;
      height: 1em;
      background: var(--accent);
      vertical-align: text-bottom;
      margin-left: 2px;
      animation: blink 0.9s step-end infinite;
    }
    @keyframes blink {
      0%, 100% { opacity: 1; }
      50%      { opacity: 0; }
    }

    .error-text { color: #ff453a; font-size: 13px; }

    /* Input bar */
    #inputbar {
      padding: 10px 14px 14px;
      background: var(--bg);
      flex-shrink: 0;
    }

    #input-wrap {
      display: flex;
      align-items: flex-end;
      gap: 8px;
      background: var(--bg-elevated);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 6px 6px 6px 14px;
      transition: border-color 0.15s, box-shadow 0.15s;
    }
    #input-wrap:focus-within {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-soft);
    }

    #input {
      flex: 1;
      border: none;
      background: transparent;
      color: var(--text);
      font-size: 14px;
      font-family: inherit;
      resize: none;
      outline: none;
      max-height: 120px;
      min-height: 22px;
      line-height: 1.45;
      padding: 5px 0;
    }
    #input::placeholder { color: var(--text-muted); }

    #send {
      width: 30px;
      height: 30px;
      background: var(--accent);
      border: none;
      border-radius: 50%;
      color: #fff;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: transform 0.1s, opacity 0.15s;
    }
    #send:hover  { transform: scale(1.05); }
    #send:active { transform: scale(0.92); }
    #send:disabled {
      background: var(--border);
      cursor: default;
      transform: none;
    }
    #send svg { width: 14px; height: 14px; }
  </style>
</head>
<body>
  <div id="titlebar">
    <span id="title-text">桌宠</span>
    <span id="model-label" class="title-sub">…</span>
  </div>

  <div id="tabbar">
    <div id="tabs"></div>
    <button id="new-tab-btn" title="新对话 (⌘T)">+</button>
  </div>

  <div id="demo-banner" style="
    display: none;
    background: linear-gradient(90deg, #fff5ed 0%, #fde6d3 100%);
    border-bottom: 1px solid #f0d4b0;
    padding: 10px 16px;
    font-size: 13px;
    color: #8a4a16;
    text-align: center;
    line-height: 1.4;
    flex-shrink: 0;
  ">
    🎭 <strong>演示模式</strong> · 现在的回复是预设的<br>
    <span style="font-size: 12px; opacity: 0.85;">配置 API Key 后解锁真聊天 → 见
      <a href="#" id="open-config-doc" style="color: #c46a2f; font-weight: 600;">使用说明</a></span>
  </div>

  <div id="messages">
    <div class="msg claude">
      <div class="bubble-text">你好 👋 想聊点什么？</div>
    </div>
  </div>

  <div id="inputbar">
    <div id="input-wrap">
      <textarea id="input" rows="1" placeholder="发消息……"></textarea>
      <button id="send" aria-label="发送">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M5 12h14M13 6l6 6-6 6"/>
        </svg>
      </button>
    </div>
  </div>

  <script>
    const { ipcRenderer } = require('electron')
    const { marked } = require('marked')

    marked.setOptions({
      gfm: true,
      breaks: true,    // Treat single newlines as <br>
    })

    function renderMd(text) {
      try { return marked.parse(text || '') } catch { return text }
    }

    const messagesEl = document.getElementById('messages')
    const inputEl    = document.getElementById('input')
    const sendBtn    = document.getElementById('send')
    const modelLabel = document.getElementById('model-label')
    const titleTextEl = document.getElementById('title-text')

    // 桌宠名字：启动时拉一次，改名时收广播刷新
    let petName = 'Clawd'
    ;(async () => {
      petName = (await ipcRenderer.invoke('get-pet-name')) || 'Clawd'
      titleTextEl.textContent = petName
      // 改名后已经渲染过的 tab 也要刷一下
      renderTabs(); renderMessages()
    })()
    ipcRenderer.on('pet-name-update', (_, name) => {
      petName = name || 'Clawd'
      titleTextEl.textContent = petName
      renderTabs(); renderMessages()
    })

    // Show active provider/model in titlebar
    const provInfo = ipcRenderer.sendSync('get-provider')
    if (provInfo) {
      modelLabel.textContent = `${provInfo.provider} · ${provInfo.model}`
    } else {
      // Demo mode — 没配 key
      modelLabel.textContent = '演示模式'
      modelLabel.style.color = '#c46a2f'
      document.getElementById('demo-banner').style.display = 'block'
      // 点击"使用说明"链接 → 用系统浏览器打开 GitHub
      const link = document.getElementById('open-config-doc')
      if (link) {
        link.addEventListener('click', (e) => {
          e.preventDefault()
          require('electron').shell.openExternal(
            'https://github.com/dujun015-design/clawd-pet/blob/main/USAGE_MAC.md'
          )
        })
      }
    }

    // ── 多 session tab 系统 ──
    // 每个 tab: { id, title, history[], messages[{role,text}], isStreaming, streamingRaw }
    const tabs = []
    let activeTabId = null
    let nextTabId = 1
    const tabsEl = document.getElementById('tabs')

    function getActiveTab() { return tabs.find(t => t.id === activeTabId) }

    function makeTab() {
      const id = `t${nextTabId++}`
      const tab = {
        id,
        title: '新对话',
        history: [],
        messages: [],
        isStreaming: false,
        streamingRaw: '',
      }
      tabs.push(tab)
      activeTabId = id
      renderTabs()
      renderMessages()
      inputEl.focus()
      return tab
    }

    function closeTab(id) {
      const idx = tabs.findIndex(t => t.id === id)
      if (idx < 0) return
      // 如果还在跑流，中断
      if (tabs[idx].isStreaming) {
        ipcRenderer.send('abort-session', id)
      }
      tabs.splice(idx, 1)
      if (id === activeTabId) {
        activeTabId = tabs[idx]?.id || tabs[idx - 1]?.id || null
        if (!activeTabId) makeTab()
      }
      renderTabs()
      renderMessages()
    }

    function switchTab(id) {
      if (id === activeTabId) return
      activeTabId = id
      renderTabs()
      renderMessages()
      inputEl.focus()
    }

    function renderTabs() {
      tabsEl.innerHTML = tabs.map(t => `
        <div class="tab ${t.id === activeTabId ? 'active' : ''}" data-id="${t.id}">
          ${t.isStreaming ? '<div class="tab-streaming-dot"></div>' : ''}
          <span class="tab-title">${escapeHtml(t.title)}</span>
          <button class="tab-close" data-id="${t.id}" title="关闭">×</button>
        </div>
      `).join('')
      tabsEl.querySelectorAll('.tab').forEach(el => {
        el.addEventListener('click', (e) => {
          if (e.target.classList.contains('tab-close')) return
          switchTab(el.dataset.id)
        })
      })
      tabsEl.querySelectorAll('.tab-close').forEach(btn => {
        btn.addEventListener('click', (e) => {
          e.stopPropagation()
          closeTab(btn.dataset.id)
        })
      })
    }

    function escapeHtml(s) {
      return String(s).replace(/[<>&"]/g, c => ({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;'}[c]))
    }

    function scrollBottom() {
      messagesEl.scrollTop = messagesEl.scrollHeight
    }

    function renderMessages() {
      const tab = getActiveTab()
      if (!tab) { messagesEl.innerHTML = ''; return }
      // 演示模式或新对话欢迎语
      const welcomeHtml = !provInfo
        ? `<div class="msg claude"><div class="bubble-text">你好 👋 我是 <b>${escapeHtml(petName)}</b> 🦀<br><br>当前是<b>演示模式</b>，我会用预设回复跟你聊几句。<br>想解锁完整 AI 聊天？给我配个 API Key 就好了～</div></div>`
        : `<div class="msg claude"><div class="bubble-text">你好 👋 想聊点什么？</div></div>`
      const msgs = tab.messages.map((m, i) => {
        const isLastClaude = i === tab.messages.length - 1 && m.role === 'claude' && tab.isStreaming
        const content = m.role === 'claude'
          ? renderMd(m.text || '') + (isLastClaude ? '<span class="cursor"></span>' : '')
          : escapeHtml(m.text)
        return `<div class="msg ${m.role}"><div class="bubble-text">${content}</div></div>`
      }).join('')
      messagesEl.innerHTML = tab.messages.length ? msgs : welcomeHtml
      requestAnimationFrame(scrollBottom)
    }

    function updateStreamingTab(tab) {
      // 局部更新当前 tab 最后那条 claude 消息（不重渲整个列表，否则光标会闪）
      if (tab.id !== activeTabId) return
      const lastBubble = messagesEl.querySelector('.msg.claude:last-child .bubble-text')
      if (!lastBubble) { renderMessages(); return }
      lastBubble.innerHTML = renderMd(tab.streamingRaw) + '<span class="cursor"></span>'
      scrollBottom()
    }

    function setStreaming(tab, on) {
      tab.isStreaming = on
      // sendBtn 是否禁用 → 看当前 tab
      if (tab.id === activeTabId) sendBtn.disabled = on
      renderTabs()
    }

    function sendMessage() {
      const text = inputEl.value.trim()
      if (!text) return
      const tab = getActiveTab()
      if (!tab || tab.isStreaming) return

      inputEl.value = ''
      inputEl.style.height = ''

      tab.messages.push({ role: 'user', text })
      tab.history.push({ role: 'user', content: text })
      // 自动取 user 第一句话作为 tab 标题
      if (tab.title === '新对话') {
        tab.title = text.slice(0, 16) + (text.length > 16 ? '…' : '')
        renderTabs()
      }
      tab.messages.push({ role: 'claude', text: '' })
      tab.streamingRaw = ''
      setStreaming(tab, true)
      renderMessages()

      ipcRenderer.send('send-prompt', {
        sessionId: tab.id,
        prompt: text,
        history: [...tab.history],
      })
    }

    ipcRenderer.on('stream-chunk', (_, { sessionId, chunk }) => {
      const tab = tabs.find(t => t.id === sessionId)
      if (!tab) return
      tab.streamingRaw += chunk
      // 同步到最后一条 claude 消息
      const last = tab.messages[tab.messages.length - 1]
      if (last && last.role === 'claude') last.text = tab.streamingRaw
      updateStreamingTab(tab)
    })

    ipcRenderer.on('stream-done', (_, { sessionId }) => {
      const tab = tabs.find(t => t.id === sessionId)
      if (!tab) return
      const last = tab.messages[tab.messages.length - 1]
      if (last && last.role === 'claude') {
        last.text = tab.streamingRaw
        tab.history.push({ role: 'assistant', content: tab.streamingRaw })
      }
      tab.streamingRaw = ''
      setStreaming(tab, false)
      if (tab.id === activeTabId) {
        renderMessages()
        inputEl.focus()
      }
    })

    ipcRenderer.on('stream-error', (_, { sessionId, message }) => {
      const tab = tabs.find(t => t.id === sessionId)
      if (!tab) return
      const last = tab.messages[tab.messages.length - 1]
      if (last && last.role === 'claude') {
        last.text = `❌ 出错了：${message}`
      }
      tab.streamingRaw = ''
      setStreaming(tab, false)
      if (tab.id === activeTabId) renderMessages()
    })

    // 初始化第一个 tab
    makeTab()

    // ⌘1 ~ ⌘8 切 tab，⌘T 新 tab，⌘W 关 tab
    document.addEventListener('keydown', (e) => {
      const meta = e.metaKey || e.ctrlKey
      if (!meta) return
      if (e.key === 't') { e.preventDefault(); makeTab(); return }
      if (e.key === 'w') {
        e.preventDefault()
        if (activeTabId) closeTab(activeTabId)
        return
      }
      const n = parseInt(e.key, 10)
      if (n >= 1 && n <= 8 && tabs[n - 1]) {
        e.preventDefault()
        switchTab(tabs[n - 1].id)
      }
    })

    document.getElementById('new-tab-btn').addEventListener('click', () => makeTab())

    sendBtn.addEventListener('click', sendMessage)

    // Track IME (Chinese pinyin) composition state — Enter during composition
    // is consumed by the IME, not for sending.
    let composing = false
    inputEl.addEventListener('compositionstart', () => { composing = true })
    inputEl.addEventListener('compositionend',   () => { composing = false })

    inputEl.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        // Skip if IME is actively composing
        if (composing || e.isComposing || e.keyCode === 229) return
        e.preventDefault()
        sendMessage()
      }
    })

    inputEl.addEventListener('input', () => {
      inputEl.style.height = ''
      inputEl.style.height = Math.min(inputEl.scrollHeight, 120) + 'px'
    })

    inputEl.focus()

    // ── 拖到桌宠的文件 → 自动塞进输入框 ──
    ;(async () => {
      const files = await ipcRenderer.invoke('claim-drop-files')
      if (files && files.length) {
        const lines = files.map(f => '📎 ' + f).join('\n')
        const prefix = files.length === 1
          ? `这个文件能干嘛？\n${lines}\n\n`
          : `帮我看一下这些文件：\n${lines}\n\n`
        inputEl.value = prefix
        inputEl.style.height = ''
        inputEl.style.height = Math.min(inputEl.scrollHeight, 120) + 'px'
        // 光标放最后
        inputEl.focus()
        inputEl.setSelectionRange(inputEl.value.length, inputEl.value.length)
      }
    })()
  </script>
</body>
</html>

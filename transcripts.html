<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>对话记录 · Clawd</title>
  <style>
    :root {
      --bg: #fafafa;
      --bg-elevated: #fff;
      --border: #ececec;
      --text: #1c1c1e;
      --text-muted: #8e8e93;
      --accent: #c46a2f;
      --accent-soft: #fdf3ec;
      --user-bg: #1c1c1e;
      --user-text: #fff;
      --ai-bg: #f4f4f5;
      --ai-text: #1c1c1e;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #1c1c1e;
        --bg-elevated: #242427;
        --border: #2f2f33;
        --text: #f2f2f7;
        --text-muted: #8e8e93;
        --accent: #e07b39;
        --accent-soft: #2a1f17;
        --user-bg: #e07b39;
        --user-text: #fff;
        --ai-bg: #2c2c2f;
        --ai-text: #f2f2f7;
      }
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; overflow: hidden; }
    body {
      font-family: -apple-system, "PingFang SC", BlinkMacSystemFont, sans-serif;
      background: var(--bg);
      color: var(--text);
      font-size: 14px;
      line-height: 1.5;
      display: flex;
      -webkit-font-smoothing: antialiased;
    }

    /* 左侧 session 列表 */
    #sidebar {
      width: 240px;
      background: var(--bg-elevated);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
    }
    #sidebar-header {
      padding: 16px 14px 10px;
      border-bottom: 1px solid var(--border);
      -webkit-app-region: drag;
    }
    #sidebar-title {
      font-size: 13px;
      font-weight: 700;
      color: var(--text);
      letter-spacing: -0.01em;
      margin-bottom: 8px;
      padding-left: 70px;
    }
    .filter-tabs {
      display: flex;
      gap: 6px;
      -webkit-app-region: no-drag;
    }
    .filter-tab {
      padding: 4px 10px;
      border-radius: 8px;
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text-muted);
      font-size: 12px;
      cursor: pointer;
      font-family: inherit;
    }
    .filter-tab.active {
      background: var(--accent);
      color: white;
      border-color: var(--accent);
    }

    #session-list {
      flex: 1;
      overflow-y: auto;
      padding: 6px;
    }
    .session-item {
      padding: 10px 12px;
      border-radius: 8px;
      cursor: pointer;
      margin-bottom: 2px;
      border: 1px solid transparent;
    }
    .session-item:hover {
      background: var(--accent-soft);
    }
    .session-item.active {
      background: var(--accent-soft);
      border-color: var(--accent);
    }
    .session-cli {
      display: inline-block;
      font-size: 10px;
      padding: 2px 6px;
      border-radius: 4px;
      font-weight: 700;
      margin-right: 6px;
      font-family: 'SF Mono', Menlo, monospace;
    }
    .session-cli.claude { background: #c46a2f; color: white; }
    .session-cli.codex  { background: #2563eb; color: white; }
    .session-title {
      font-size: 13px;
      font-weight: 600;
      color: var(--text);
      margin-top: 4px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .session-time {
      font-size: 11px;
      color: var(--text-muted);
      margin-top: 2px;
    }

    /* 右侧消息区 */
    #main {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    #main-header {
      padding: 14px 18px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--bg);
      -webkit-app-region: drag;
    }
    #current-title {
      font-size: 14px;
      font-weight: 600;
    }
    #current-meta {
      font-size: 12px;
      color: var(--text-muted);
    }
    .toggle-watch {
      -webkit-app-region: no-drag;
      background: var(--accent);
      color: white;
      border: none;
      padding: 6px 12px;
      border-radius: 8px;
      font-size: 12px;
      cursor: pointer;
      font-family: inherit;
    }
    .toggle-watch.off {
      background: var(--ai-bg);
      color: var(--text-muted);
    }

    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 20px 22px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    #messages::-webkit-scrollbar { width: 6px; }
    #messages::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

    .msg {
      max-width: 82%;
      display: flex;
      flex-direction: column;
    }
    .msg.user { align-self: flex-end; }
    .msg.assistant { align-self: flex-start; }
    .bubble {
      padding: 10px 14px;
      border-radius: 16px;
      font-size: 13.5px;
      line-height: 1.55;
      word-wrap: break-word;
      word-break: break-word;
    }
    .user .bubble {
      background: var(--user-bg);
      color: var(--user-text);
      border-bottom-right-radius: 4px;
      white-space: pre-wrap;
    }
    .assistant .bubble {
      background: var(--ai-bg);
      color: var(--ai-text);
      border-bottom-left-radius: 4px;
    }
    .assistant .bubble p { margin: 0; }
    .assistant .bubble p + p { margin-top: 8px; }
    .assistant .bubble code {
      font-family: 'SF Mono', Menlo, monospace;
      font-size: 12px;
      background: rgba(0,0,0,0.06);
      padding: 1px 5px;
      border-radius: 4px;
    }
    @media (prefers-color-scheme: dark) {
      .assistant .bubble code { background: rgba(255,255,255,0.08); }
    }
    .assistant .bubble pre {
      background: rgba(0,0,0,0.06);
      padding: 8px 10px;
      border-radius: 8px;
      overflow-x: auto;
      margin-top: 8px;
    }
    @media (prefers-color-scheme: dark) {
      .assistant .bubble pre { background: rgba(255,255,255,0.08); }
    }
    .assistant .bubble pre code { background: transparent; padding: 0; }
    .assistant .bubble strong { font-weight: 700; }
    .assistant .bubble em { font-style: italic; }
    .assistant .bubble ul, .assistant .bubble ol { padding-left: 22px; margin-top: 6px; }

    .empty {
      color: var(--text-muted);
      text-align: center;
      padding: 60px 24px;
      font-size: 14px;
      line-height: 1.7;
    }
    .empty h3 { font-size: 16px; margin-bottom: 12px; color: var(--text); }
  </style>
</head>
<body>

  <div id="sidebar">
    <div id="sidebar-header">
      <div id="sidebar-title">最近对话</div>
      <div class="filter-tabs">
        <button class="filter-tab active" data-filter="all">全部</button>
        <button class="filter-tab" data-filter="claude">Claude</button>
        <button class="filter-tab" data-filter="codex">Codex</button>
      </div>
    </div>
    <div id="session-list"></div>
  </div>

  <div id="main">
    <div id="main-header">
      <div>
        <div id="current-title">选个 session 看看</div>
        <div id="current-meta"></div>
      </div>
      <button class="toggle-watch off" id="watch-btn">▶ 实时跟随</button>
    </div>
    <div id="messages">
      <div class="empty">
        <h3>📜 这里展示你在终端跟 Claude / Codex 的对话</h3>
        左侧选一条 session，桌宠就帮你看着了。<br>
        点「▶ 实时跟随」每秒自动刷新，方便后台跑长任务时偷看进度。
      </div>
    </div>
  </div>

  <script>
    const { ipcRenderer, shell } = require('electron')
    const { marked } = require('marked')
    marked.setOptions({ gfm: true, breaks: true })

    let sessions = []
    let currentFilter = 'all'
    let currentSession = null
    let watchTimer = null

    const listEl    = document.getElementById('session-list')
    const messagesEl= document.getElementById('messages')
    const titleEl   = document.getElementById('current-title')
    const metaEl    = document.getElementById('current-meta')
    const watchBtn  = document.getElementById('watch-btn')

    function renderSessionList() {
      const filtered = currentFilter === 'all'
        ? sessions
        : sessions.filter(s => s.cli === currentFilter)
      listEl.innerHTML = filtered.map(s => `
        <div class="session-item ${currentSession?.path === s.path ? 'active' : ''}" data-path="${s.path}">
          <div>
            <span class="session-cli ${s.cli}">${s.cli}</span>
            <span class="session-time">${timeAgo(s.mtime)}</span>
          </div>
          <div class="session-title">${escapeHtml(s.title)}</div>
        </div>
      `).join('')
      listEl.querySelectorAll('.session-item').forEach(el => {
        el.addEventListener('click', () => {
          const path = el.dataset.path
          const s = sessions.find(x => x.path === path)
          if (s) selectSession(s)
        })
      })
    }

    function escapeHtml(s) {
      return String(s).replace(/[<>&"]/g, c => ({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;'}[c]))
    }

    function timeAgo(t) {
      const sec = (Date.now() - t) / 1000
      if (sec < 60) return '刚刚'
      if (sec < 3600) return `${Math.floor(sec/60)} 分钟前`
      if (sec < 86400) return `${Math.floor(sec/3600)} 小时前`
      return `${Math.floor(sec/86400)} 天前`
    }

    function scrollToBottom() {
      messagesEl.scrollTop = messagesEl.scrollHeight
    }

    let prevMsgCount = 0
    function renderMessages(msgs) {
      const stayAtBottom = messagesEl.scrollTop + messagesEl.clientHeight >= messagesEl.scrollHeight - 30
      messagesEl.innerHTML = msgs.length
        ? msgs.map(m => `
          <div class="msg ${m.role}">
            <div class="bubble">${m.role === 'user' ? escapeHtml(m.text) : marked.parse(m.text || '')}</div>
          </div>
        `).join('')
        : '<div class="empty">这个 session 暂时空空如也</div>'
      if (stayAtBottom || msgs.length > prevMsgCount) scrollToBottom()
      prevMsgCount = msgs.length
    }

    async function selectSession(s) {
      currentSession = s
      renderSessionList()
      titleEl.textContent = s.title
      metaEl.textContent = `${s.cli.toUpperCase()} · ${new Date(s.mtime).toLocaleString('zh-CN')}`
      const msgs = await ipcRenderer.invoke('read-transcript', s)
      prevMsgCount = 0
      renderMessages(msgs)
    }

    async function refreshList() {
      sessions = await ipcRenderer.invoke('list-transcripts')
      renderSessionList()
      // 如果当前 session 还在列表里，更新 mtime
      if (currentSession) {
        const fresh = sessions.find(x => x.path === currentSession.path)
        if (fresh) currentSession = fresh
      }
    }

    function toggleWatch() {
      if (watchTimer) {
        clearInterval(watchTimer)
        watchTimer = null
        watchBtn.textContent = '▶ 实时跟随'
        watchBtn.classList.add('off')
      } else {
        if (!currentSession) return
        watchBtn.textContent = '⏸ 停止跟随'
        watchBtn.classList.remove('off')
        watchTimer = setInterval(async () => {
          if (!currentSession) return
          const msgs = await ipcRenderer.invoke('read-transcript', currentSession)
          renderMessages(msgs)
          await refreshList()
        }, 1500)
      }
    }

    watchBtn.addEventListener('click', toggleWatch)

    document.querySelectorAll('.filter-tab').forEach(tab => {
      tab.addEventListener('click', () => {
        document.querySelectorAll('.filter-tab').forEach(t => t.classList.remove('active'))
        tab.classList.add('active')
        currentFilter = tab.dataset.filter
        renderSessionList()
      })
    })

    // 启动
    ;(async () => {
      await refreshList()
      if (sessions.length) await selectSession(sessions[0])
    })()
  </script>
</body>
</html>
